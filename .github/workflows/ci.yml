name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, API docs, types, metadata and tests
        run: pnpm check
      - name: Build library
        run: pnpm build:lib
      - name: Check package contents
        run: pnpm package:check
      - name: Install tarball and test React 19.2 compatibility
        run: pnpm package:smoke
      - name: Build documentation
        run: pnpm build:docs
